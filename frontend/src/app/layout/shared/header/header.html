<div class="container">
  <header
    class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom"
  >
    <a
      routerLink="/"
      class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none"
    >
      My Store
    </a>

    <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
      <li>
        <a routerLink="/home" class="nav-link px-2 link-dark" routerLinkActive="active">Home</a>
      </li>
      <li>
        <a routerLink="/product-list" class="nav-link px-2 link-dark" routerLinkActive="active"
          >Our Products</a
        >
      </li>
      <li>
        <a routerLink="/testimonials" class="nav-link px-2 link-dark" routerLinkActive="active"
          >Reviews</a
        >
      </li>
    </ul>

    <div class="col-md-4 text-end">
      <a routerLink="/cart" class="btn btn-outline-dark me-2">
        Cart
        @if (cartCount > 0) {
          <span class="badge bg-danger ms-1">{{ cartCount }}</span>
        }
      </a>

      @if (userName == '') {
        <button type="button" class="btn btn-outline-primary me-2" routerLink="/login">
          Login
        </button>
        <button type="button" class="btn btn-primary" routerLink="/signup">Sign-up</button>
      } @else {
        Welcome: {{ userName }}
        <a routerLink="/account" class="btn btn-outline-secondary ms-2">My Account</a>
        <a routerLink="/orders" class="btn btn-outline-secondary ms-2">My Orders</a>
        <button type="button" class="btn btn-primary ms-2" (click)="logout()">Logout</button>
      }
    </div>
  </header>
</div>
